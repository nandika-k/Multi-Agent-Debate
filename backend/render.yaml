services:
  - type: web
    name: multi-agent-debate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DEBATE_DATA_DIR
        value: /tmp/debate_data
    healthCheckPath: /health
